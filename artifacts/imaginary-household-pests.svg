<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500">
<defs>
  <pattern id="paper" width="28" height="28" patternUnits="userSpaceOnUse"><rect width="28" height="28" fill="#f4f0df"/><circle cx="4" cy="5" r=".8" fill="#d8d0b8" opacity=".5"/><circle cx="18" cy="20" r=".6" fill="#d8d0b8" opacity=".38"/></pattern>
  <style><![CDATA[
    .ink{fill:#24342d}.muted{fill:#64736b}.rule{stroke:#31453b;stroke-width:2}.fine{stroke:#9aa49d;stroke-width:1.5}.box{fill:#faf7eb;stroke:#31453b;stroke-width:2}.num{font:700 13px Arial;letter-spacing:2px;fill:#f4f0df}.name{font:700 27px Georgia,serif;fill:#24342d}.latin{font:italic 14px Georgia,serif;fill:#758078}.note{font:18px Georgia,serif;fill:#29372f}.small{font:13px Arial;fill:#617068}.label{font:700 13px Arial;letter-spacing:2px;fill:#506059}.line{fill:none;stroke:#2e4036;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#52655a;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.accent{fill:#b65f4a}.ochre{fill:#d4ab55}.green{fill:#789b70}.blue{fill:#6d8e98}.cream{fill:#efe5bd}
  ]]></style>
</defs>
