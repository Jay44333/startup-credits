<rect x="28" y="28" width="944" height="1444" rx="3" fill="none" stroke="#24342d" stroke-width="3"/>
<text x="60" y="78" class="label">DOMESTIC NATURAL HISTORY · OBSERVATION SHEET 05</text>
<text x="60" y="132" font-family="Georgia,serif" font-size="50" font-weight="700" fill="#24342d">A Field Guide to Five</text>
<text x="60" y="184" font-family="Georgia,serif" font-size="50" font-weight="700" fill="#24342d">Imaginary Household Pests</text>
<text x="60" y="218" font-family="Georgia,serif" font-size="18" font-style="italic" fill="#68766f">Minor inhabitants identified by the inconveniences they leave behind.</text>
<rect x="580" y="66" width="357" height="44" rx="22" fill="#24342d"/><text x="758.5" y="94" text-anchor="middle" font-family="Arial" font-size="11.2" font-weight="700" letter-spacing="1.4" fill="#f4f0df">AN ENTIRELY FICTIONAL FIELD GUIDE</text>
<line x1="60" x2="940" y1="244" y2="244" class="rule"/>

<rect x="60" y="270" width="880" height="210" rx="8" class="box"/><rect x="60" y="270" width="76" height="30" fill="#31453b"/><text x="98" y="291" text-anchor="middle" class="num">01</text>
<g transform="translate(86,313)">
  <ellipse cx="76" cy="78" rx="51" ry="35" fill="#789b70" stroke="#2e4036" stroke-width="4"/>
  <circle cx="121" cy="67" r="26" fill="#efe5bd" stroke="#2e4036" stroke-width="4"/>
  <circle cx="130" cy="61" r="3.5" class="ink"/><path d="M119 46 C118 11 148 0 160 22 M123 47 C139 17 176 16 182 42" class="line"/>
