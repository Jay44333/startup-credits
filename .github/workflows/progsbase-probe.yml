name: Progsbase bounty probe

on:
  push:
    branches:
      - progsbase-probe-20260922

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe current bounty functions
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error

          def post(label, url, payload):
              data=json.dumps(payload,separators=(',',':')).encode()
              req=urllib.request.Request(url,data=data,headers={'Content-Type':'application/json','User-Agent':'progsbase-bounty-probe/1.0'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      body=r.read().decode('utf-8','replace')
                      print('LABEL',label,'STATUS',r.status,'PAYLOAD',json.dumps(payload,ensure_ascii=True),'BODY',body[:2000])
              except urllib.error.HTTPError as e:
                  print('LABEL',label,'STATUS',e.code,'PAYLOAD',json.dumps(payload,ensure_ascii=True),'BODY',e.read().decode('utf-8','replace')[:1200])
              except Exception as e:
                  print('LABEL',label,'ERROR',repr(e))
              print('---')

          jurl='https://run.progsbase.com/no.inductive.idea10.programs/JSON/0.5.14/IsValidJSON'
          nurl='https://run.progsbase.com/no.inductive.idea10.programs/numbers/0.1.35/CreateNumberFromDecimalStringWithCheck'

          # Determine the positional wire format first using ordinary valid inputs.
          post('json-pos-string-refobj', jurl, ['{"a":1}', {'string':''}])
          post('json-pos-chararray-refobj', jurl, [list('{"a":1}'), {'string':[]}])
          post('json-wrapped-object', jurl, [{'json':'{"a":1}','message':{'string':''}}])
          post('num-pos-string-refobj', nurl, ['1.2', {'numberValue':0}, {'string':''}])
          post('num-pos-chararray-refobj', nurl, [list('1.2'), {'numberValue':0}, {'string':[]}])
          post('num-wrapped-object', nurl, [{'string':'1.2','decimalReference':{'numberValue':0},'message':{'string':''}}])

          # If positional strings are accepted, exercise the candidate boundary cases.
          for s in ['1e113','9.99999999999999e113','1e114','1e1000','-1e114','+1.2']:
              post('num-case-'+s, nurl, [s, {'numberValue':0}, {'string':''}])
          for s in ['1e113','9.99999999999999e113','1e114','[1,2,3]','"\\uABCD"']:
              post('json-case-'+s, jurl, [s, {'string':''}])
          PY
